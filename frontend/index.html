<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="asset/img/logo/Sentrivo_logo.png">
    <title>Sentrivo | Monitoring Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    <link rel="stylesheet" href="css/index.css">
    <script type="module" src="scripts/index.js" defer></script>
    <script type="module" src="scripts/login.js" defer></script>
    <script type="module" src="scripts/register.js" defer></script>
</head>
<body>
    <div class="demo-mod">
        <button class="demo">Live Demo</button>
    </div>
    <header>
        <img src="asset/img/logo/Sentrivo_logo_HQ.png" alt="">
        <div class="header-text">
            <h1>Sentrivo</h1>
            <p>Monitor. Detect. Respond.</p>
        </div>
    </header>
    <section id="connexion">
        <div class="button">
            <button class="login modalOpen" data-modal="login">Login</button>
            <button class="register modalOpen" data-modal="register">Register</button>
        </div>
    </section>
    <footer>
        <p>© 2026 Sentrivo | Monitor. Detect. Respond.</p>
    </footer>
    <section id="login" class="modal">
        <div class="container-errorAuth hidden">
            <i class="fa-solid fa-circle-xmark errorI"></i>
            <p class="errorAuth">Invalid email or password.</p>
        </div>
        <div class="modal-content">
            <div class="modal-head">
            <i class="fa-solid fa-xmark exit-cross"></i>
            <img src="asset/img/avatar/avatar.png" alt="avatar">
            </div>
            <form class="modal-form" id="loginSentrivo">
                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="Email address">
                </div>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Password">
                </div>
                <div class="modal-option">
                    <label for="remember">
                        <input type="checkbox" id="remember" name="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="#">Forget Password ?</a>
                </div>
                <button type="submit" class="modal-submit">Connexion</button>
            </form>
        </div>
    </section>
    <section id="register" class="modal">
        <div class="modal-content register-content">
            <div class="modal-head">
                <i class="fa-solid fa-xmark exit-cross"></i>
                <img src="asset/img/avatar/avatar.png" alt="avatar">
            </div>
            <form class="modal-form" id="form-register">
                <div class="input-box">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" autocomplete="username" id="rusername" name="username" placeholder="Username" required>
                </div>
                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" autocomplete="email" id="remail" name="email" placeholder="Email address" required>
                </div>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" autocomplete="new-password" id="rpassword" name="password" placeholder="Password" required>
                </div>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" autocomplete="new-password" id="rconfirmPassword" name="confirmPassword" placeholder="Confirm password" required>
                </div>
                <div class="term">
                    <label for="terms">
                        <input type="checkbox" id="terms" name="terms" required>
                        <span>I agree to the <a href="#">Terms and Conditions</a></span>
                    </label>
                </div>
                <button type="submit" class="modal-submit register">Create Account</button>
            </form>
        </div>
    </section>
</body>
</html>
